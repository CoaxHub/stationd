[package]
name = "backend-ka9q"
description = "ka9q-radio (radiod) backend for stationd: TLV control, RTP Opus audio, spectrum rows"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
rand = "0.10.3"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["net", "rt", "time", "macros", "sync"] }
tracing = "0.1.44"
zstd = "0.14.0"

[dev-dependencies]
proptest = "1.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util", "macros"] }
