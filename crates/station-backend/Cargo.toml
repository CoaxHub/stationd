[package]
name = "station-backend"
description = "The stationd Backend trait (station-protocol §9) and a deterministic FakeBackend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
coaxhub-station-proto = { path = "../station-proto" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.19"
zstd = { version = "0.14.0", default-features = false }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util", "macros"] }
