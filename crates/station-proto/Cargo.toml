[package]
name = "coaxhub-station-proto"
description = "CoaxHub station protocol (coaxhub.station.v1): generated types, limits, validation, reconnection policy and station identity"
version = "0.1.0"
edition.workspace = true
# The station protocol and this crate are MIT, unlike the rest of
# the workspace (GPL-3.0-only). A hub implementation may depend on this crate alone.
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"
# cargo-fuzz targets are their own workspace (nightly only).
exclude = ["fuzz"]

[lib]
name = "station_proto"

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
thiserror = "2.0.21"
# Only what the generated clients and servers need; hub and stationd enable
# transport and TLS features on their own tonic dependency.
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
uuid = "1.26.1"
x509-parser = "0.18.1"
zstd = { version = "0.14.0", default-features = false }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
proptest = "1.11.0"
rcgen = "0.14.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
