# Generated by stationd backend-config for receiver 11 (slot 12) from <templates>/rtlsdr-v4.conf (SDR profile "rtlsdr-v4").
# Do not edit: it is rendered again before every start of its radiod.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `rtlsdr-v4` SDR profile: an RTL-SDR Blog V4 (RTL2832U +
# R828D with a built-in HF upconverter) on HF and VHF/UHF. Derived from
# testdata/radiod-rtlsdr-v4.conf.
#
# `stationd backend-config --receiver <id>` renders this file, for one receiver of
# receivers.json, into /run/coaxhub-radiod/<id>/radiod.conf before every start of
# coaxhub-radiod@<id>.service. Placeholders:
#   {{status_group}}        the status/command group of the receiver's slot, 239.77.<slot>.6
#   {{data_group}}          the RTP group of its slot, 239.77.<slot>.4 (no port: radiod-notes §2)
#   {{center_frequency_hz}} the receiver's centre (7.1 MHz by default)
#   {{serial}}              its SDR's USB serial; the line is left out without one
#   {{gain_db}}             its tuner gain (30 dB by default)
# The groups and TTL 0 keep radiod's traffic on the loopback interface.
# The V4 receives HF through its tuner: the bundled librtlsdr switches the upconverter in
# below 28.8 MHz, so the frequency is the HF frequency itself and there is no direct
# sampling (which receives nothing on a V4). The tuner's gain is in the signal path.

[global]
hardware = rtlsdr
description = "RTL-SDR Blog V4"
status = 239.77.12.6
data = 239.77.12.4
ttl = 0
preset = usb
advertise = no

[rtlsdr]
device = rtlsdr
description = "RTL-SDR Blog V4"
# The SDR, by its USB serial (stable across reboots and cabling).
serial = 00000002
# 2.048 MS/s complex: a 2.048 MHz passband, the usual RTL-SDR rate.
samprate = 2048000
# Passband centre; the default 7.1 MHz covers about 6.08 .. 8.12 MHz (the 40 m band).
frequency = 145500000
# Fixed tuner gain in dB (no AGC).
agc = no
gain = 28.5
