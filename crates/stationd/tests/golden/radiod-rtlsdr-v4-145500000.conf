# Generated by stationd backend-config from <templates>/rtlsdr-v4.conf (SDR profile "rtlsdr-v4").
# Do not edit: it is rendered again before every radiod start.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `rtlsdr-v4` SDR profile: an RTL-SDR Blog V4 (RTL2832U +
# R828D with a built-in HF upconverter) on HF and VHF/UHF. Derived from
# testdata/radiod-rtlsdr-v4.conf.
#
# `stationd backend-config` renders this file into /run/coaxhub-radiod/radiod.conf before
# every start of coaxhub-radiod.service. Placeholders:
#   {{status_group}}        radiod's status/command group, fixed by the package
#   {{data_group}}          radiod's RTP group, fixed by the package (no port: radiod-notes §2)
#   {{center_frequency_hz}} [sdr] center_frequency_hz, or the profile default (7.1 MHz)
# The groups and TTL 0 keep radiod's traffic on the loopback interface.
# The V4 receives HF through its tuner: the bundled librtlsdr switches the upconverter in
# below 28.8 MHz, so the frequency is the HF frequency itself and there is no direct
# sampling (which receives nothing on a V4). The tuner's gain is in the signal path.

[global]
hardware = rtlsdr
description = "RTL-SDR Blog V4"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = usb
advertise = no

[rtlsdr]
device = rtlsdr
description = "RTL-SDR Blog V4"
# 2.048 MS/s complex: a 2.048 MHz passband, the usual RTL-SDR rate.
samprate = 2048000
# Passband centre; the default 7.1 MHz covers about 6.08 .. 8.12 MHz (the 40 m band).
frequency = 145500000
# Fixed tuner gain in dB (no AGC).
agc = no
gain = 30
