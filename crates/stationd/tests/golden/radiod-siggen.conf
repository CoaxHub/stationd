# Generated by stationd backend-config from <templates>/siggen.conf (SDR profile "siggen").
# Do not edit: it is rendered again before every radiod start.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `siggen` SDR profile: radiod's built-in signal generator, no
# SDR hardware. Development builds of stationd only. Derived from
# testdata/radiod-siggen.conf.
#
# `stationd backend-config` renders this file. Placeholders:
#   {{status_group}}        radiod's status/command group, fixed by the package
#   {{data_group}}          radiod's RTP group, fixed by the package (no port: radiod-notes §2)
# The signal generator's LO is fixed at 0 Hz, so there is no centre frequency.

[global]
hardware = sig_gen
description = "coaxhub sig_gen"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = am
advertise = no

[sig_gen]
device = sig_gen
description = "coaxhub sig_gen"
# 24 MS/s real samples: the front end covers 0 .. 12 MHz with the LO at 0 Hz.
samprate = 24m0
real = yes
# One carrier at 10.000 MHz, -20 dBFS, AM-modulated 50 % by a 1 kHz tone (needs sox).
carrier = 10m0
amplitude = -20
modulation = am
source = "sox -q -n -t raw -r 48000 -e signed-integer -b 16 -c 1 - synth 1000000 sine 1000 vol 0.5"
# White Gaussian noise across the whole band, total -30 dBFS.
noise = -30
