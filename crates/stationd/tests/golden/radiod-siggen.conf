# Generated by stationd backend-config for receiver 11 (slot 0) from <templates>/siggen.conf (SDR profile "siggen").
# Do not edit: it is rendered again before every start of its radiod.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `siggen` SDR profile: radiod's built-in signal generator, no
# SDR hardware. Development builds of stationd only; the hub never configures it. Derived
# from testdata/radiod-siggen.conf.
#
# `stationd backend-config --receiver <id>` renders this file for a receiver of
# receivers.json. Placeholders:
#   {{status_group}}        the status/command group of the receiver's slot, 239.77.<slot>.6
#   {{data_group}}          the RTP group of its slot, 239.77.<slot>.4 (no port: radiod-notes §2)
# The signal generator's LO is fixed at 0 Hz, so there is no centre frequency.

[global]
hardware = sig_gen
description = "coaxhub sig_gen"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = am
advertise = no

[sig_gen]
device = sig_gen
description = "coaxhub sig_gen"
# 24 MS/s real samples: the front end covers 0 .. 12 MHz with the LO at 0 Hz.
samprate = 24m0
real = yes
# One carrier at 10.000 MHz, -20 dBFS, AM-modulated 50 % by a 1 kHz tone (needs sox).
carrier = 10m0
amplitude = -20
modulation = am
source = "sox -q -n -t raw -r 48000 -e signed-integer -b 16 -c 1 - synth 1000000 sine 1000 vol 0.5"
# White Gaussian noise across the whole band, total -30 dBFS.
noise = -30
