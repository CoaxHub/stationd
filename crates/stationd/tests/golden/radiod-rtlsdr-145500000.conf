# Generated by stationd backend-config for receiver 11 (slot 0) from <templates>/rtlsdr.conf (SDR profile "rtlsdr").
# Do not edit: it is rendered again before every start of its radiod.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `rtlsdr` SDR profile: an RTL-SDR dongle
# (RTL2832U + R820T/R828D) on VHF/UHF. Derived from testdata/radiod-rtlsdr.conf.
#
# `stationd backend-config --receiver <id>` renders this file, for one receiver of
# receivers.json, into /run/coaxhub-radiod/<id>/radiod.conf before every start of
# coaxhub-radiod@<id>.service. Placeholders:
#   {{status_group}}        the status/command group of the receiver's slot, 239.77.<slot>.6
#   {{data_group}}          the RTP group of its slot, 239.77.<slot>.4 (no port: radiod-notes §2)
#   {{center_frequency_hz}} the receiver's centre (98 MHz by default)
#   {{serial}}              its SDR's USB serial; the line is left out without one
#   {{gain_db}}             its tuner gain (30 dB by default)
# The groups and TTL 0 keep radiod's traffic on the loopback interface.

[global]
hardware = rtlsdr
description = "coaxhub rtl-sdr"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = am
advertise = no

[rtlsdr]
device = rtlsdr
description = "coaxhub rtl-sdr"
# The SDR, by its USB serial (stable across reboots and cabling).
# 2.048 MS/s complex: a 2.048 MHz passband, the usual RTL-SDR rate.
samprate = 2048000
# A fixed passband centre locks the tuner; only the owner moves it.
frequency = 145500000
# Fixed tuner gain in dB (no AGC).
agc = no
gain = 30
