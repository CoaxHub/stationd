#
# radiod config template for the `rtlsdr` SDR profile: an RTL-SDR dongle
# (RTL2832U + R820T/R828D) on VHF/UHF. Derived from testdata/radiod-rtlsdr.conf.
#
# `stationd backend-config` renders this file into /run/coaxhub-radiod/radiod.conf before
# every start of coaxhub-radiod.service. Placeholders:
#   {{status_group}}        radiod's status/command group, fixed by the package
#   {{data_group}}          radiod's RTP group, fixed by the package (no port: radiod-notes §2)
#   {{center_frequency_hz}} [sdr] center_frequency_hz, or the profile default (98 MHz)
# The groups and TTL 0 keep radiod's traffic on the loopback interface.

[global]
hardware = rtlsdr
description = "coaxhub rtl-sdr"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = am
advertise = no

[rtlsdr]
device = rtlsdr
description = "coaxhub rtl-sdr"
# 2.048 MS/s complex: a 2.048 MHz passband, the usual RTL-SDR rate.
samprate = 2048000
# A fixed passband centre locks the tuner; only the owner moves it.
frequency = 145500000
# Fixed tuner gain in dB (no AGC).
agc = no
gain = 30
