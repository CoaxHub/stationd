# Generated by stationd backend-config from <templates>/rtlsdr-hf.conf (SDR profile "rtlsdr-hf").
# Do not edit: it is rendered again before every radiod start.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `rtlsdr-hf` SDR profile: an RTL-SDR (Blog V3 or another
# Q-branch-capable dongle) on HF by direct sampling. Derived from
# testdata/radiod-rtlsdr-hf.conf.
#
# `stationd backend-config` renders this file into /run/coaxhub-radiod/radiod.conf before
# every start of coaxhub-radiod.service. Placeholders:
#   {{status_group}}        radiod's status/command group, fixed by the package
#   {{data_group}}          radiod's RTP group, fixed by the package (no port: radiod-notes §2)
#   {{center_frequency_hz}} [sdr] center_frequency_hz, or the profile default (7.1 MHz)
# The groups and TTL 0 keep radiod's traffic on the loopback interface.
# The description becomes the station's `Capabilities.sdr_model`: "direct sampling" in it
# says that the tuner's gain is not in the signal path (the owner's advice on overloads).

[global]
hardware = rtlsdr
description = "RTL-SDR HF direct sampling"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = usb
advertise = no

[rtlsdr]
device = rtlsdr
description = "RTL-SDR HF direct sampling"
# Q-branch direct sampling: the tuner is bypassed and the RTL2832U ADC samples the HF input.
direct_sampling = 2
samprate = 2048000
# Passband centre; the default 7.1 MHz covers about 6.08 .. 8.12 MHz (the 40 m band).
frequency = 7100000
agc = no
