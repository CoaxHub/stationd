# Generated by stationd backend-config for receiver 11 (slot 7) from <templates>/rtlsdr-hf.conf (SDR profile "rtlsdr-hf").
# Do not edit: it is rendered again before every start of its radiod.
# SPDX-License-Identifier: GPL-3.0-only
#
# radiod config template for the `rtlsdr-hf` SDR profile: an RTL-SDR (Blog V3 or another
# Q-branch-capable dongle) on HF by direct sampling. Direct sampling receives nothing on
# an RTL-SDR Blog V4, which has the `rtlsdr-v4` profile, and stationd never gives a V4
# this one. Derived from testdata/radiod-rtlsdr-hf.conf.
#
# `stationd backend-config --receiver <id>` renders this file, for one receiver of
# receivers.json, into /run/coaxhub-radiod/<id>/radiod.conf before every start of
# coaxhub-radiod@<id>.service. Placeholders:
#   {{status_group}}        the status/command group of the receiver's slot, 239.77.<slot>.6
#   {{data_group}}          the RTP group of its slot, 239.77.<slot>.4 (no port: radiod-notes §2)
#   {{center_frequency_hz}} the receiver's centre (7.1 MHz by default)
#   {{serial}}              its SDR's USB serial; the line is left out without one
# The groups and TTL 0 keep radiod's traffic on the loopback interface.
# The description becomes the receiver's `sdr_model`: "direct sampling" in it says that
# the tuner's gain is not in the signal path (the owner's advice on overloads).

[global]
hardware = rtlsdr
description = "RTL-SDR HF direct sampling"
status = 239.77.7.6
data = 239.77.7.4
ttl = 0
preset = usb
advertise = no

[rtlsdr]
device = rtlsdr
description = "RTL-SDR HF direct sampling"
# The SDR, by its USB serial (stable across reboots and cabling).
serial = 00000001
# Q-branch direct sampling: the tuner is bypassed and the RTL2832U ADC samples the HF input.
direct_sampling = 2
samprate = 2048000
# Passband centre; the default 7.1 MHz covers about 6.08 .. 8.12 MHz (the 40 m band).
frequency = 7100000
agc = no
