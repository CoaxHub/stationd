[package]
name = "coaxhub-helper"
description = "The station's one root door: starts, restarts and stops the receivers' coaxhub-radiod@ units for stationd, on a socket (packaging.md §4)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "coaxhub_helper"

[[bin]]
name = "coaxhub-helper"
path = "src/main.rs"

[dependencies]
# SO_PEERCRED without unsafe code.
# (`time`: rustix 1.1.5 does not build `net` without one of the features that bring its timespec.)
rustix = { version = "1.1.5", default-features = false, features = ["std", "net", "time"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
