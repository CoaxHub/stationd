# /etc/coaxhub/stationd.toml: this station's configuration (station protocol §7).
#
# You control this file; the hub cannot change it. After editing it, restart
# the services: sudo systemctl restart coaxhub-radiod stationd
# `stationd check-config` validates it.

# What the hub may ask for.
allow_frontend_control = true       # SetFrontend from the owner dashboard
allowed_admin_ops = []              # any of: "restart_stationd", "restart_backend", "update", "reboot_host"

# Hard local caps. The hub may ask for less, never more.
max_channels = 16
max_waterfall_subscriptions = 4

# The receiver. The installer detects the SDR and sets the profile.
[sdr]
profile = "rtlsdr"                  # rtlsdr (VHF/UHF), rtlsdr-hf (HF by direct sampling)
# center_frequency_hz = 98000000    # optional start frequency; default from the profile
