#
# The kernel's DVB-T driver claims RTL-SDR dongles, and radiod then cannot
# open them. Installed by coaxhub-stationd, which needs no blacklist from the
# system's librtlsdr packages. It applies from the next boot, or at once
# after `sudo rmmod dvb_usb_rtl28xxu` (the installer does this).
blacklist dvb_usb_rtl28xxu
