# Nightly, and on a manual run: every cargo-fuzz target for longer than a push can afford.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust nightly (cargo-fuzz needs it)
        run: rustup toolchain install nightly --profile minimal
      - name: Install protoc (station-proto's build.rs runs it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 10 minutes
        run: ./scripts/fuzz.sh 600
      - name: Keep the crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/*/fuzz/artifacts/
          if-no-files-found: ignore
