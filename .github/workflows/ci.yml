# CI for stationd: the workspace's checks, the end-to-end tests against radiod, a short
# fuzz run, the four packages with their install and installer tests, and the DCO check on
# pull requests. Actions are pinned by commit; Dependabot moves them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables only (backtraces keep file and line): full debug info fills the runner's
  # disk once clippy and the tests share a target directory, and it makes the cache bigger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  workspace:
    # fmt, clippy, the tests, stationd as packaged, the protocol on its own, cargo-deny and
    # the license boundary, in one job with one target directory.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust (the release in rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install protoc (station-proto's build.rs runs it) and jq (the license boundary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev jq
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - name: stationd as packaged (a built-in domain and a throwaway root CA)
        run: |
          D=$(mktemp -d)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout /dev/null -subj /CN=test-root -days 1 -out "$D/root.pem"
          COAXHUB_DOMAIN=coaxhub.test COAXHUB_ROOT_CA="$D/root.pem" \
            cargo nextest run -p stationd --features packaged --locked
      - name: The protocol compiles on its own
        run: protoc -I proto --descriptor_set_out=/dev/null proto/coaxhub/station/v1/*.proto
      - run: cargo deny check
      - run: ./scripts/check-license-boundary.sh

  e2e:
    # radiod with its signal generator (no SDR): stationd's ka9q backend, end to end.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust (the release in rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install the build and radiod dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev pkg-config libssl-dev clang \
            libbsd-dev libfftw3-dev libiniparser-dev libopus-dev libogg-dev \
            libsamplerate0-dev libusb-1.0-0-dev libncurses-dev librtlsdr-dev rtl-sdr \
            sox tcpdump opus-tools sysstat iproute2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Enable multicast on loopback
        run: sudo ip link set dev lo multicast on
      - run: ./scripts/e2e-station.sh

  fuzz:
    # Every cargo-fuzz target for 60 s from the committed seed corpus; nightly.yml runs
    # them longer on a schedule. A crash is uploaded as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Rust nightly (cargo-fuzz needs it)
        run: rustup toolchain install nightly --profile minimal
      - name: Install protoc (station-proto's build.rs runs it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target for 60 s
        run: ./scripts/fuzz.sh 60
      - name: Keep the crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: crates/*/fuzz/artifacts/
          if-no-files-found: ignore

  packages:
    # The four coaxhub-stationd packages (bookworm and trixie × amd64 and arm64, arm64
    # cross-compiled) with a throwaway root, then the install, remove and purge tests, the
    # unit checks and the installer against a signed test repository, in Debian containers.
    # Releases are built by release.yml with the production domain and root.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The daemon's own BuildKit: no buildkit image to pull from Docker Hub.
          driver: docker
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck
        run: |
          shellcheck -x packaging/*.sh packaging/deb/*.sh packaging/deb/postinst packaging/deb/prerm \
            packaging/deb/postrm packaging/test/*.sh packaging/test/in-container/*.sh scripts/*.sh
          shellcheck -s sh installer/station.sh
      - name: Build the packages
        run: |
          D=$(mktemp -d)
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout /dev/null -subj /CN=ci-root -days 2 -out "$D/root.pem"
          COAXHUB_DOMAIN=coaxhub.test COAXHUB_ROOT_CA="$D/root.pem" packaging/build-all.sh
      - run: packaging/test/test-packages.sh
      - run: packaging/test/test-installer.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coaxhub-stationd-packages
          path: target/packages/
          retention-days: 7

  dco:
    # CONTRIBUTING.md's rule: every commit of a pull request carries a Signed-off-by
    # trailer (git commit -s). Dependabot's commits are exempt.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .*<.*>$'; then
              echo "::error::commit $sha is missing a Signed-off-by trailer (git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          exit "$missing"
