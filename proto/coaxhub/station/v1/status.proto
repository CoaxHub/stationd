// CoaxHub Stations — station health and events.
//
// SPDX-License-Identifier: MIT
// The station protocol is MIT-licensed so any implementation (including the
// CoaxHub hub) can use it.
// Semantics, limits and validation rules: docs/station-protocol.md.
//
// Everything here is a claim made by the station. The hub stores it for the
// owner dashboard and alerts; it never drives security decisions.

syntax = "proto3";

package coaxhub.station.v1;

import "coaxhub/station/v1/measure.proto";
import "coaxhub/station/v1/receivers.proto";

// Periodic health snapshot, every Welcome.status_interval_ms.
message StationStatus {
  uint64 uptime_s = 1;       // stationd process uptime
  HostHealth host = 2;
  // Every configured receiver, running or not, at most 16.
  repeated ReceiverHealth receivers = 3;
  uint32 active_channels = 4;
  uint32 active_subscriptions = 5;
  // Frames dropped by the station's outbound queue since stationd start.
  uint64 audio_frames_dropped_total = 6;
  uint64 waterfall_rows_dropped_total = 7;
  // Measurement reports dropped by the outbound queue (older than 10 s)
  // since stationd start.
  uint64 measurement_reports_dropped_total = 8;
}

message HostHealth {
  float load_avg_1m = 1;
  uint32 cpu_count = 2;
  // Absent when the platform does not expose a CPU temperature sensor.
  optional float cpu_temp_c = 3;
  uint64 mem_used_bytes = 4;
  uint64 mem_total_bytes = 5;
  uint64 host_uptime_s = 6;
}

// One configured receiver.
message ReceiverHealth {
  uint32 receiver_id = 1;
  ReceiverState state = 2;
  // Untrusted detail for FAILED and NO_DEVICE, at most 256 bytes UTF-8.
  string detail = 3;
  BackendHealth backend = 4;
  // Present while the receiver runs.
  FrontendHealth frontend = 5;
  uint32 active_channels = 6;
  // CPU time its backend used over the last interval, as a share of one
  // core (1.0 = one core busy). Absent when unknown.
  optional float backend_cpu = 7;
}

message BackendHealth {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_RUNNING = 1;
    STATE_DEGRADED = 2;  // running but reporting errors
    STATE_DOWN = 3;      // not reachable by stationd
  }
  State state = 1;
  string version = 2;  // informational, untrusted
}

message FrontendHealth {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OK = 1;
    STATE_OVERLOAD = 2;   // ADC clipping in the last interval
    STATE_NO_DEVICE = 3;  // SDR not present / lost
  }
  State state = 1;
  uint32 sample_rate_hz = 2;
  uint64 center_frequency_hz = 3;
  float gain_db = 4;
  // ADC overload events since stationd start.
  uint64 overloads_total = 5;
  // Wideband input power, dBFS.
  optional float input_power_dbfs = 6;
}

// Asynchronous notification.
message Event {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_FRONTEND_OVERLOAD = 1;    // receiver_id set
    KIND_DEVICE_LOST = 2;          // receiver_id set
    KIND_DEVICE_RESTORED = 3;      // receiver_id set
    // receiver_id set: that receiver's channels and subscriptions are gone.
    KIND_BACKEND_RESTARTED = 4;
    KIND_CHANNEL_CLOSED = 5;       // channel_id set; hub must not reuse it without OpenChannel
    KIND_SUBSCRIPTION_CLOSED = 6;  // subscription_id set
    // receiver_id set: its tunable range changed; hub re-reads capabilities.
    KIND_FRONTEND_CHANGED = 7;
    KIND_SHUTTING_DOWN = 8;        // stationd is stopping
    KIND_MEASUREMENT_STOPPED = 9;  // measurement_id and measurement_stop_reason set
    // measurement_id, receiver_id, measurement_duty and effective_unix_ms set.
    KIND_MEASUREMENT_DUTY = 10;
    // receiver_id and receiver_state set (detail for FAILED and NO_DEVICE).
    // A receiver entering or leaving RUNNING: hub re-reads capabilities.
    KIND_RECEIVER_STATE = 11;
    // An SDR was plugged in or removed: hub re-reads the hardware.
    KIND_HARDWARE_CHANGED = 12;
  }
  Kind kind = 1;
  optional uint32 channel_id = 2;
  optional uint32 subscription_id = 3;
  // Untrusted detail, at most 256 bytes UTF-8. Displayed escaped.
  string detail = 4;
  optional uint32 receiver_id = 5;
  optional ReceiverState receiver_state = 6;
  // The plan a measurement event is about.
  optional uint32 measurement_id = 7;
  // MEASUREMENT_DUTY: the receiver's new duty...
  optional MeasurementDuty measurement_duty = 8;
  // ...and the UTC minute it applies from, Unix ms (a multiple of 60000).
  optional int64 effective_unix_ms = 9;
  // MEASUREMENT_STOPPED: why the station stopped the plan.
  optional MeasurementStopReason measurement_stop_reason = 10;
}
