// CoaxHub Stations — station measurements.
//
// SPDX-License-Identifier: MIT
// The station protocol is MIT-licensed so any implementation (including the
// CoaxHub hub) can use it.
// Semantics, limits and validation rules: docs/station-protocol.md
// §4.1, §5.2 and §6.4.
//
// The hub asks a station to measure the noise floor of a few frequency ranges
// with a plan (StartMeasurements). Each band lies inside one receiver. The
// station runs the plan on its own clock, on low-rate spectrum channels of its
// own (one per receiver measured) that are not listener capacity, and never
// retunes a front end for it. Each receiver measures every minute while it
// has listener channels or waterfall subscriptions open (continuous duty),
// and only the UTC minutes whose number is a multiple of 5 while it has none
// (idle duty). Every value is an untrusted claim, uncalibrated, on the
// backend's scale.

syntax = "proto3";

package coaxhub.station.v1;

import "coaxhub/station/v1/common.proto";
import "coaxhub/station/v1/control.proto";

// Continuous while the receiver has listener channels or waterfall
// subscriptions open; idle (the UTC minutes whose number is a multiple of 5)
// while it has none. The station decides it per receiver; the hub never sets
// it.
enum MeasurementDuty {
  MEASUREMENT_DUTY_UNSPECIFIED = 0;
  MEASUREMENT_DUTY_CONTINUOUS = 1;
  MEASUREMENT_DUTY_IDLE = 2;
}

// Why the station stopped a plan on its own (Event MEASUREMENT_STOPPED).
enum MeasurementStopReason {
  MEASUREMENT_STOP_REASON_UNSPECIFIED = 0;
  // SetFrontend, a receiver reconfigured, or a front end changed by itself
  // (FRONTEND_CHANGED, RECEIVER_STATE).
  MEASUREMENT_STOP_REASON_FRONTEND_CHANGED = 1;
  // A receiver's backend restarted (BACKEND_RESTARTED).
  MEASUREMENT_STOP_REASON_BACKEND_RESTARTED = 2;
  // The backend refused or lost a measurement channel.
  MEASUREMENT_STOP_REASON_BACKEND_ERROR = 3;
}

// Starts a plan. measurement_id is chosen by the hub, like channel and
// subscription ids; one plan per connection.
message StartMeasurements {
  uint32 measurement_id = 1;
  // At most 32 across receivers, band_id unique, each inside one receiver's
  // coverage.
  repeated NoiseBand noise_bands = 2;
  // Report cadence, ms: 60000 (one report per receiver per measured minute).
  uint32 noise_interval_ms = 3;
  // The measurement spectrum channel: bin_count bins of resolution_bw_hz each
  // (1024 x 500 Hz: one 512 kHz window). BIN_COUNT is fixed for the
  // channel's life.
  uint32 bin_count = 4;
  float resolution_bw_hz = 5;
  // Time spent on each window before the channel hops to the next one, ms (4000).
  uint32 dwell_ms = 6;
  // Time between two polls of the channel, ms (500: 2 polls/s).
  uint32 poll_interval_ms = 7;
}

// One noise band of a plan.
message NoiseBand {
  // Hub-assigned, unique in the plan, never 0.
  uint32 band_id = 1;
  // The receiver whose coverage holds the band.
  uint32 receiver_id = 2;
  // The parts of the band to measure: 1-8 ranges, sorted and apart,
  // start_hz < end_hz. The station pools only bins inside them.
  repeated FrequencyRange ranges = 3;
  // The band's name, for logs only ("40m"): 1-8 bytes of [a-z0-9].
  string key = 4;
}

// The plan as the station runs it. Answers StartMeasurements with OK.
message MeasurementsStarted {
  uint32 measurement_id = 1;
  // The accepted subset of the requested bands; ranges may only shrink.
  repeated NoiseBand noise_bands = 2;
  // Each receiver measured, once.
  repeated MeasuredReceiver receivers = 3;
  // The measurement method (what a value means: windows, statistic,
  // normalisation). 1 = the first method.
  uint32 method_version = 4;
}

// One receiver of a running plan.
message MeasuredReceiver {
  uint32 receiver_id = 1;
  // The actual cadence, ms, >= the requested one: 60000, or 120000 or 300000
  // when the receiver's windows don't fit one minute and its cycle stretches.
  uint32 noise_interval_ms = 2;
  // The receiver's duty from the next UTC minute on.
  MeasurementDuty duty = 3;
  // The front end the plan runs under.
  FrontendState frontend = 4;
}

// Stops the plan. NOT_FOUND is harmless.
message StopMeasurements {
  uint32 measurement_id = 1;
}

// The noise floor of one receiver's measured minute: one per receiver per
// measured minute, sent in the minute that follows it.
message NoiseFloorReport {
  uint32 measurement_id = 1;
  uint32 receiver_id = 2;
  // UTC, the start of the measured minute: a multiple of 60000.
  int64 window_start_unix_ms = 3;
  // The window's length, ms: 60000.
  uint32 window_ms = 4;
  // The receiver's front-end settings the window was measured under.
  FrontendState frontend = 5;
  // ADC overload events during the window.
  uint32 overloads = 6;
  // The station's clock while measuring.
  ClockState clock = 7;
  // The receiver's bands measured in this window, at most 32, each an
  // accepted band_id once.
  repeated BandNoise bands = 8;
  // Fewer spectra than planned went into the window (the channel was warming
  // up, a poll failed): the values are less certain.
  bool partial = 9;
  // How many measured minutes one cycle over the receiver's windows takes
  // (1, 2 or 5), and which of them this window is (0-based).
  uint32 cycle_minutes = 10;
  uint32 cycle_index = 11;
}

// One band's noise over one window.
message BandNoise {
  uint32 band_id = 1;
  // What was measured: from the lowest to the highest frequency pooled,
  // inside the band's accepted ranges.
  FrequencyRange measured = 2;
  float resolution_bw_hz = 3;
  // Bins x spectra pooled, at most 1,000,000.
  uint32 samples = 4;
  // Quantiles of the pooled per-bin power spectral density, dB/Hz,
  // uncalibrated, on a 0.1 dB grid: p10 <= p25 <= p50 <= p90.
  float p10_db_hz = 5;
  float p25_db_hz = 6;
  float p50_db_hz = 7;
  float p90_db_hz = 8;
}

// The station's clock, as the station sees it.
message ClockState {
  // Whether the clock is synchronised (NTP).
  bool synchronized = 1;
  // The clock's maximum error, ms; 0 when the station can't tell.
  uint32 max_error_ms = 2;
}
