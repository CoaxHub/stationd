syntax = "proto3";

package coaxhub.station.v1;

import "coaxhub/station/v1/common.proto";

// ------------------------------------------------------------ Capabilities

message GetCapabilities {}

message Capabilities {
  // The receivers running now, in frequency order. Their tunable ranges
  // never overlap. Empty: the station has no receiver running.
  repeated ReceiverCapabilities receivers = 1;
  // What every receiver can demodulate and encode.
  repeated Mode modes = 2;
  repeated AudioCodec codecs = 3;
  // Waterfall subscriptions, across all receivers.
  WaterfallLimits waterfall = 4;
  // The station can measure (measure.proto). Absent: it can't, and the hub
  // sends it no plan.
  MeasurementLimits measurements = 5;
}

// One running receiver: one SDR with its own backend.
message ReceiverCapabilities {
  // As configured by the hub (ConfigureReceivers).
  uint32 receiver_id = 1;
  // Range the receiver can demodulate RIGHT NOW without retuning its
  // front end (the current passband). Listeners can only tune inside it.
  FrequencyRange tunable_range = 2;
  // Full range the hardware could cover if the owner retunes the front end.
  FrequencyRange hardware_range = 3;
  uint32 sample_rate_hz = 4;
  // Maximum simultaneous audio channels on this receiver.
  uint32 max_channels = 5;
  FrontendControls frontend = 6;
  // Informational, untrusted, at most 64 bytes: e.g. "RTL-SDR Blog V4".
  string sdr_model = 7;
}

// What the station's measuring accepts (measure.proto).
message MeasurementLimits {
  // The most noise bands the station accepts in a plan, across receivers;
  // the hub clamps it to 32.
  uint32 max_noise_bands = 1;
  // The measurement method the station runs (MeasurementsStarted.method_version).
  uint32 method_version = 2;
}

message WaterfallLimits {
  uint32 max_bins = 1;             // per subscription
  uint32 min_row_interval_ms = 2;  // fastest row rate supported
  uint32 max_subscriptions = 3;    // across all receivers
}

message FrontendControls {
  bool has_gain = 1;
  float min_gain_db = 2;
  float max_gain_db = 3;
  bool has_hardware_agc = 4;
  bool has_attenuator = 5;
  float max_attenuation_db = 6;
  // Selectable antenna ports, e.g. ["A", "B"]. Empty = not selectable.
  // Untrusted labels, at most 8 entries of 16 bytes.
  repeated string antenna_ports = 7;
  // Whether the frontend center frequency can be changed at runtime.
  bool can_retune = 8;
}

// ------------------------------------------------------------ Audio channels

// Creates a demodulated audio channel on one receiver. channel_id is chosen
// by the hub and must not be in use on this connection. The channel stays on
// that receiver for its life.
message OpenChannel {
  uint32 channel_id = 1;
  uint32 receiver_id = 2;
  uint64 frequency_hz = 3;
  Mode mode = 4;
  int32 low_cut_hz = 5;
  int32 high_cut_hz = 6;
  AudioParams audio = 7;
  // Squelch threshold in dB SNR. Absent = squelch off.
  optional float squelch_snr_db = 8;
}

// What the station actually configured (may be rounded by the backend).
message ChannelOpened {
  uint32 channel_id = 1;
  uint32 receiver_id = 2;
  uint64 frequency_hz = 3;
  Mode mode = 4;
  int32 low_cut_hz = 5;
  int32 high_cut_hz = 6;
  AudioParams audio = 7;
}

// Changes an open channel in place, on its receiver. Absent fields keep their
// value. Codec parameters cannot change; close and reopen instead.
message UpdateChannel {
  uint32 channel_id = 1;
  optional uint64 frequency_hz = 2;
  optional Mode mode = 3;
  optional int32 low_cut_hz = 4;
  optional int32 high_cut_hz = 5;
  optional float squelch_snr_db = 6;
  // true = turn squelch off (squelch_snr_db is ignored).
  bool squelch_off = 7;
}

message ChannelUpdated {
  uint32 channel_id = 1;
  uint64 frequency_hz = 2;
  Mode mode = 3;
  int32 low_cut_hz = 4;
  int32 high_cut_hz = 5;
}

message CloseChannel {
  uint32 channel_id = 1;
}

// ------------------------------------------------------------ Frontend

// Changes one receiver's hardware settings while it runs. Affects every
// channel on that receiver, so the hub only sends it on behalf of the owner
// (never a listener). Only what the receiver's FrontendControls offer; what
// its backend can't change live is a receiver setting (ConfigureReceivers).
// Absent fields keep their value.
message SetFrontend {
  uint32 receiver_id = 1;
  optional float gain_db = 2;
  optional bool hardware_agc = 3;
  optional float attenuation_db = 4;
  optional string antenna_port = 5;
  // Moves the passband. Existing channels outside the new passband are
  // closed by the station (Event CHANNEL_CLOSED).
  optional uint64 center_frequency_hz = 6;
}

message FrontendState {
  uint32 receiver_id = 1;
  float gain_db = 2;
  bool hardware_agc = 3;
  float attenuation_db = 4;
  string antenna_port = 5;
  uint64 center_frequency_hz = 6;
  FrequencyRange tunable_range = 7;
}

// ------------------------------------------------------------ Waterfall

// Starts a spectrum stream on one receiver. subscription_id is chosen by the
// hub.
message SubscribeWaterfall {
  uint32 subscription_id = 1;
  uint32 receiver_id = 2;
  FrequencyRange range = 3;
  // Number of bins across the range. 64..=Capabilities.waterfall.max_bins.
  uint32 bins = 4;
  // Time between rows. >= Capabilities.waterfall.min_row_interval_ms.
  uint32 row_interval_ms = 5;
  Quantization quantization = 6;
  WaterfallCompression compression = 7;
}

// What the station actually configured. Rows use exactly these values.
message WaterfallSubscribed {
  uint32 subscription_id = 1;
  uint32 receiver_id = 2;
  FrequencyRange range = 3;
  uint32 bins = 4;
  uint32 row_interval_ms = 5;
  Quantization quantization = 6;
  WaterfallCompression compression = 7;
}

message UnsubscribeWaterfall {
  uint32 subscription_id = 1;
}

// ------------------------------------------------------------ Liveness

message Ping {
  uint64 nonce = 1;
  int64 hub_time_unix_ms = 2;
}

message Pong {
  uint64 nonce = 1;
  int64 station_time_unix_ms = 2;
}

// ------------------------------------------------------------ Admin operations

// Typed maintenance operations, sent only on behalf of the owner. A station
// that doesn't implement a kind answers RESULT_CODE_UNSUPPORTED.
// There is deliberately no "run command" or "push config" operation.
enum AdminOpKind {
  ADMIN_OP_KIND_UNSPECIFIED = 0;
  ADMIN_OP_KIND_RESTART_STATIOND = 1;  // restart the stationd service
  ADMIN_OP_KIND_RESTART_BACKEND = 2;   // restart one receiver's backend, or all
  ADMIN_OP_KIND_UPDATE = 3;            // upgrade CoaxHub packages from the signed repo
  ADMIN_OP_KIND_REBOOT_HOST = 4;       // reboot the machine
}

// The station replies with RESULT_CODE_OK when the operation is accepted,
// then performs it. The connection may drop as a consequence.
message AdminOp {
  AdminOpKind kind = 1;
  // RESTART_BACKEND: the receiver; absent = every receiver.
  optional uint32 receiver_id = 2;
}
