# SPDX-License-Identifier: GPL-3.0-only
#
# radiod test configuration: built-in signal generator, no SDR hardware.
# Used by scripts/run-radiod-siggen.sh and the ka9q backend integration tests.
# Findings and the client contract: docs/radiod-notes.md.
#
# Pinned upstream: ka9q-radio 384b269aaf5e9ee1015185ae7c0cdd60f4d2ecbd.

[global]
hardware = sig_gen
description = "coaxhub-test sig_gen"
# Control/status multicast group (UDP port 5006 is implied; a numeric address
# is used verbatim, no mDNS/avahi lookup: src/radio.c loadconfig()).
status = 239.77.0.6
# RTP data group for dynamic channels (port 5004 implied; per-channel status also
# goes to this address on port 5006). Setting 'data' enables dynamic channel creation.
data = 239.77.0.4
# TTL 0: all output is sent on the loopback interface only (src/multicast.c output_mcast()).
ttl = 0
# Template preset for dynamic channels, before any PRESET in the creating command.
preset = am
# No avahi daemon in the container; do not try to advertise mDNS services.
advertise = no
# FFT planning: no wisdom file exists, so radiod falls back to FFTW_ESTIMATE plans
# (src/filter.c plan_r2c: FFTW_WISDOM_ONLY, then ESTIMATE) and starts in < 1 s.

[sig_gen]
device = sig_gen
description = "coaxhub-test sig_gen"
# Real (not complex) samples at 24 MS/s: the front end covers 0 .. 12 MHz with the LO at 0 Hz.
samprate = 24m0
real = yes
# One carrier at 10.000 MHz, -20 dBFS, AM-modulated 50% by a 1 kHz tone.
carrier = 10m0
amplitude = -20
modulation = am
# The modulation source is popen()ed and must write 16-bit signed native-endian mono PCM
# at 48 kHz on stdout (src/sig_gen.c input_callback). sox is installed by
# build-radiod.sh. 1e6 s of tone is ~11.6 days; when it ends the generator stalls.
source = "sox -q -n -t raw -r 48000 -e signed-integer -b 16 -c 1 - synth 1000000 sine 1000 vol 0.5"
# White Gaussian noise across the whole 12 MHz band, total -30 dBFS.
noise = -30
