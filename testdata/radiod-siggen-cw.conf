# SPDX-License-Identifier: GPL-3.0-only
#
# radiod development configuration: the built-in signal generator keyed in Morse, no SDR
# hardware. `scripts/dev-stack.sh --backend siggen` runs it (scripts/run-radiod-siggen.sh
# with RADIOD_CONF set to this file), so a CW decoder can be tried live. The tests keep
# using radiod-siggen.conf (the 1 kHz AM tone): this file is for people, not for assertions.
# Findings and the client contract: docs/radiod-notes.md.
#
# Pinned upstream: ka9q-radio 384b269aaf5e9ee1015185ae7c0cdd60f4d2ecbd.
#
# How the keying works (src/sig_gen.c proc_sig_gen): the generator can only modulate a carrier
# with a sample stream popen()ed from `source`, as (dc + m) * amplitude * carrier, where m is
# the stream scaled to -1 .. +1 and dc is 1 for `am` and 0 for `dsb`. With `dsb` the carrier is
# on while the stream holds a constant level and off while it holds 0, so a stream that is
# 0 between elements and a constant level during them is the carrier keyed on and off (OOK),
# which is what a CW transmitter sends. The key-down level is a constant, not a tone: a
# receiver in CW mode hears the carrier against its beat-frequency oscillator.

[global]
hardware = sig_gen
description = "coaxhub-test sig_gen cw"
# Control/status multicast group (UDP port 5006 is implied; a numeric address
# is used verbatim, no mDNS/avahi lookup: src/radio.c loadconfig()).
status = 239.77.0.6
# RTP data group for dynamic channels (port 5004 implied; per-channel status also
# goes to this address on port 5006). Setting 'data' enables dynamic channel creation.
data = 239.77.0.4
# TTL 0: all output is sent on the loopback interface only (src/multicast.c output_mcast()).
ttl = 0
# Template preset for dynamic channels, before any PRESET in the creating command.
preset = am
# No avahi daemon in the container; do not try to advertise mDNS services.
advertise = no

[sig_gen]
device = sig_gen
description = "coaxhub-test sig_gen cw"
# Real (not complex) samples at 24 MS/s: the front end covers 0 .. 12 MHz with the LO at 0 Hz.
samprate = 24m0
real = yes
# One carrier at 7.030 MHz (inside the 40 m CW segment, and inside the dev stack's 40 m
# receiver), about -20 dBFS while the key is down, keyed in Morse by `source`.
carrier = 7m030
amplitude = -20
modulation = dsb
# The stream is 16-bit signed native-endian mono PCM at 48 kHz (sox); the generator
# resamples it to the front end's rate by linear interpolation. The text is CQ CQ DE LU1JGU at
# 18 WPM, repeating: one unit (a dit, a gap between elements) is 3200 samples = 66.7 ms
# (PARIS timing, 1.2 s / 18), a dah 3 units, a gap between letters 3 units, between words
# 7 units. Per token of the list, the shell emits:
#   d   a dit then 1 unit of silence        h   a dah then 1 unit of silence
#   l   2 more units (a letter gap)         w   6 more units (a word gap)
# The list is the text in International Morse, one token per element. Each key-down element
# is a constant level with half-sine edges of 288 samples (6 ms) so it does not click, then
# the unit of silence is `pad`. `| cat || exit` ends the loop when radiod closes the pipe:
# radiod's popen() is closed at every front-end stop and waits for the shell to end, and sox
# alone does not (it reports Broken pipe and exits 0), but cat's exit status is the
# pipeline's.
# The line must stay under iniparser's 1024-character limit, and have no double quote.
source = "sh -c 'm() { sox -D -q -n -t raw -r 48000 -e signed-integer -b 16 -c 1 - $@ | cat || exit; }; k() { m synth $1 sine 0 0 90 fade h 288s $1 288s vol 1.6 pad 0 3200s; }; g() { m trim 0 $1; }; while :; do for e in h d h d l h h d h w h d h d l h h d h w h d d l d w d h d d l d d h l d h h h h l d h h h l h h d l d d h w w; do case $e in d) k 3200s;; h) k 9600s;; l) g 6400s;; w) g 19200s;; esac; done; done'"
# White Gaussian noise across the whole 12 MHz band, total -30 dBFS.
noise = -30
