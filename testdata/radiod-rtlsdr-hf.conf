# SPDX-License-Identifier: GPL-3.0-only
#
# radiod test configuration: RTL-SDR (Blog V3 or other Q-branch-capable dongle)
# on HF via direct sampling; a Blog V4 uses testdata/radiod-rtlsdr-v4.conf.
# Same multicast/TTL-0 layout as the other test configs.
#   RADIOD_CONF=testdata/radiod-rtlsdr-hf.conf scripts/run-radiod-siggen.sh start
# Findings: docs/radiod-notes.md.
#
# Pinned upstream: ka9q-radio 384b269aaf5e9ee1015185ae7c0cdd60f4d2ecbd.

[global]
hardware = rtlsdr
description = "coaxhub-test rtl-sdr hf"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = usb
advertise = no

[rtlsdr]
device = rtlsdr
description = "coaxhub-test rtl-sdr hf"
# Q-branch direct sampling: the R820T tuner is bypassed and the RTL2832U ADC
# samples the HF input directly (RTL-SDR Blog V3 HF path).
direct_sampling = 2
samprate = 2048000
# Passband centre 7.1 MHz: about 6.08 .. 8.12 MHz, covering the 40 m amateur band
# (7.0-7.3 MHz; FT8 at 7.074 MHz) and the 41 m broadcast band.
frequency = 7m1
agc = no
