# SPDX-License-Identifier: GPL-3.0-only
#
# radiod test configuration: a real RTL-SDR dongle (RTL2832U + R820T/R828D).
# Same multicast/TTL-0 layout as radiod-siggen.conf, so the ka9q client
# works unchanged. Start with:
#   RADIOD_CONF=testdata/radiod-rtlsdr.conf scripts/run-radiod-siggen.sh start
# Findings and the client contract: docs/radiod-notes.md.
#
# Pinned upstream: ka9q-radio 384b269aaf5e9ee1015185ae7c0cdd60f4d2ecbd.

[global]
hardware = rtlsdr
description = "coaxhub-test rtl-sdr"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = am
advertise = no

[rtlsdr]
device = rtlsdr
description = "coaxhub-test rtl-sdr"
# 2.048 MS/s complex: a 2.048 MHz passband, the usual RTL-SDR rate.
samprate = 2048000
# Fixed passband centre: FM broadcast band (a fixed frequency locks the tuner,
# matching our model where only the owner moves the passband).
# Tunable range is then about 97.0 .. 99.0 MHz.
frequency = 98m0
# Fixed tuner gain in dB (no AGC) so CPU and spectrum measurements are repeatable.
agc = no
gain = 30
