# SPDX-License-Identifier: GPL-3.0-only
#
# radiod test configuration: an RTL-SDR Blog V4 (RTL2832U + R828D with a built-in
# HF upconverter) on HF through its tuner. Same multicast/TTL-0 layout as the other
# test configs.
#   RADIOD_CONF=testdata/radiod-rtlsdr-v4.conf scripts/run-radiod-siggen.sh start
# Findings: docs/radiod-notes.md.
#
# Pinned upstream: ka9q-radio 384b269aaf5e9ee1015185ae7c0cdd60f4d2ecbd, linked
# against osmocom librtlsdr 2.0.2 or newer (the V4 needs it).

[global]
hardware = rtlsdr
description = "coaxhub-test rtl-sdr blog v4"
status = 239.77.0.6
data = 239.77.0.4
ttl = 0
preset = usb
advertise = no

[rtlsdr]
device = rtlsdr
description = "coaxhub-test rtl-sdr blog v4"
# No direct sampling: librtlsdr switches the V4's upconverter in below 28.8 MHz,
# so the HF frequency is tuned as it is.
samprate = 2048000
# Passband centre 7.1 MHz: about 6.08 .. 8.12 MHz, covering the 40 m amateur band
# (7.0-7.3 MHz; FT8 at 7.074 MHz) and the 41 m broadcast band.
frequency = 7m1
# Fixed tuner gain in dB (no AGC): the V4's gain is in the signal path on HF too.
agc = no
gain = 30
